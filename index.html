<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFL Season 1 | Official Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <header>
        <img src="1000059186.png" alt="EFL Logo" class="logo">
        <h1 class="gold-text">ELITE FOOTBALL LEAGUE</h1>
        <div class="admin-zone">
            <button id="adminToggle" onclick="unlockAdmin()">Admin Login</button>
        </div>
    </header>

    <main class="container">
        <section class="card" id="captureArea">
            <div class="card-header">
                <h2>LEAGUE STANDINGS</h2>
                <button id="downloadBtn" onclick="downloadTable()">Download Table</button>
            </div>
            <div class="table-wrapper">
                <table id="mainTable">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th class="text-left">Player</th>
                            <th>P</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>GD</th>
                            <th class="gold-pts">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h2>FIXTURES & RESULTS</h2>
            <div id="fixtureContainer">
                </div>
            <button id="saveBtn" class="hidden" onclick="saveData()">SAVE & UPDATE ALL DEVICES</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
